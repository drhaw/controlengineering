            const isLastContent = contentIndex === currentContents.length - 1;

                    window.speechSynthesis.cancel();

            }, []);

            const toggleSpeech = (textToSpeak) => {
                if (!window.speechSynthesis) {
                    alert(lang === 'ms' ? "Pelayar anda tidak menyokong fungsi suara." : "Your browser does not support speech synthesis.");
                    return;
                }

                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                } else {
                    window.speechSynthesis.cancel();
                    
                    let cleanText = textToSpeak.replace(/\*\*/g, '').replace(/_/g, ' ');
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    
                    const voices = window.speechSynthesis.getVoices();
                    let selectedVoice = null;

                    if (lang === 'ms') {
                        selectedVoice = voices.find(v => v.lang === 'ms-MY' || v.lang === 'id-ID') || 
                                        voices.find(v => v.lang.includes('ms') || v.lang.includes('id'));
                    } else {
                        selectedVoice = voices.find(v => (v.lang === 'en-SG' || v.lang === 'en-IN') && (v.name.includes('Female') || v.name.includes('Google'))) ||
                                        voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria'))) ||
                                        voices.find(v => v.lang.includes('en'));
                    }

                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    } else {
                        utterance.lang = lang === 'ms' ? 'ms-MY' : 'en-US';
                    }
                    
                    utterance.rate = 0.9;
                    utterance.onend = () => setIsSpeaking(false);
                    utterance.onerror = () => setIsSpeaking(false);
                    
                    window.speechSynthesis.speak(utterance);
                    setIsSpeaking(true);
                }
            };

            const TTSButton = ({ text }) => (
                <button 
                    onClick={() => toggleSpeech(text)}
                    className={`ml-3 p-2 rounded-full transition-colors flex items-center justify-center no-print ${isSpeaking ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'}`}
                    title={isSpeaking ? "Berhenti" : "Dengar Penerangan"}
                >
                    {isSpeaking ? (
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z M9 9h6v6H9z"></path></svg>
                    ) : (
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A.996.996 0 0015 20V4a.996.996 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z"></path></svg>
                    )}

            );

            const processSubscript = (text) => {
                const parts = text.split(/([A-Za-zθΘ]+_\w+)/g);
                return parts.map((part, i) => {
                    if (part.includes('_')) {
                        const [base, sub] = part.split('_');
                        return <span key={i}>{base}<sub>{sub}</sub></span>;
                    }
                    return <span key={i}>{part}</span>;
                });
            };

            const formatText = (text) => {
                if (!text) return null;
                const lines = text.split('\n');
                return lines.map((line, lineIndex) => {
                    const boldParts = line.split(/(\*\*.*?\*\*)/g);
                    const formattedLine = boldParts.map((boldPart, bIndex) => {
                        if (boldPart.startsWith('**') && boldPart.endsWith('**')) {
                            const content = boldPart.slice(2, -2);
                            return <strong key={bIndex}>{processSubscript(content)}</strong>;
                        }
                        return <span key={bIndex}>{processSubscript(boldPart)}</span>;
                    });
                    
                    return (
                        <React.Fragment key={lineIndex}>
                            {formattedLine}
                            {lineIndex < lines.length - 1 && <br />}
                        </React.Fragment>
                    );
                });
            };

            const toggleLang = () => setLang(l => l === 'ms' ? 'en' : 'ms');

            const handleCheckAnswer = () => {
                if (selectedAnswer === null) return;
                setIsAnswerChecked(true);
                if (selectedAnswer === currentContent.answer) {

                        setContentIndex(0);
                        setScore(0);
                        setSelectedAnswer(null);
                        setIsAnswerChecked(false);

                } else if (currentContent.type === "quiz") {

                                {t[lang].quizBadge}
                            </div>

                                <h2 className="text-2xl font-bold text-gray-800">{currentContent.title[lang]}</h2>
                                <TTSButton text={textToRead} />
                            </div>
                            <div className="text-gray-800 text-lg font-medium">
                                {formatText(currentContent.q[lang])}

                                            (i === currentContent.answer ? 'bg-green-50 border-green-500 text-green-900 shadow-sm' : 
                                            (selectedAnswer === i ? 'bg-red-50 border-red-500 text-red-900' : 'opacity-60 bg-gray-50 border-gray-200'))

                                            (selectedAnswer === i ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50 border-gray-200')
                                    }`}>

                                            name="quiz-option"

                            </div>

                                    )}
                                    {currentContent.explanation && (
                                        <div className={`text-sm p-3 rounded-lg mt-1 shadow-inner ${isCorrect ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
                                            <strong>{t[lang].explanation}</strong><br/>
                                            <span className="text-gray-700 leading-relaxed block mt-1">
                                                {formatText(currentContent.explanation[lang])}
                                            </span>
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="mt-8 flex justify-end nav-buttons">
                                {!isAnswerChecked ? (
                                    <button 
                                        onClick={handleCheckAnswer} 
                                        disabled={selectedAnswer === null}
                                        className={`font-semibold py-3 px-6 rounded-xl shadow-md transition ${selectedAnswer !== null ? 'bg-indigo-600 hover:bg-indigo-700 text-white transform hover:scale-105 active:scale-95' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                                    >
                                        {t[lang].checkAnswer}
                                    </button>
                                ) : (
                                    <button 
                                        onClick={handleNext} 
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition transform hover:scale-105 active:scale-95 flex items-center gap-2"
                                    >
                                        {isLastContent && isLastCategory ? t[lang].completed : t[lang].nextQuestion}
                                    </button>
                                )}
                            </div>
                        </div>
                    );
                } else if (currentContent.type === "assessment") {
                    const textToRead = currentContent.content[lang];
                    return (
                        <div className="space-y-6">
                            <div className="bg-amber-50 text-amber-800 text-xs font-bold px-3 py-1 rounded-full inline-block mb-2 no-print">
                                {t[lang].assessmentBadge} ({contentIndex + 1}/{currentContents.length})
                            </div>
                            <div className="flex items-center border-b pb-4">
                                <h2 className="text-3xl font-bold text-gray-800">{currentContent.title[lang]}</h2>
                                <TTSButton text={textToRead} />
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 my-6">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">{t[lang].studentName}</label>
                                    <input 
                                        type="text" 
                                        value={studentName}
                                        onChange={(e) => setStudentName(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" 
                                        placeholder="Name..." 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">{t[lang].studentId}</label>
                                    <input 
                                        type="text" 
                                        value={studentId}
                                        onChange={(e) => setStudentId(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" 
                                        placeholder="Student ID..." 
                                    />
                                </div>
                            </div>
                            <div className="text-gray-800 leading-relaxed text-lg bg-blue-50 p-6 rounded-xl border border-blue-100">
                                {formatText(currentContent.content[lang])}
                            </div>
                            <div className="print-space"></div>
                            <div className="print-space" style={{marginTop: '40px'}}></div>
                            <div className="mt-8 flex justify-between items-center no-print">
                                <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                    {t[lang].printPdf}
                                </button>
                                <button onClick={handleNext} className="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition transform hover:scale-105 active:scale-95">
                                    {isLastContent && isLastCategory ? t[lang].completed : t[lang].nextQuestion}
                                </button>
                            </div>
                        </div>
                    );
                }
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#f8fafc]">
                    <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center z-20 shadow-md no-print">
                        <div className="font-bold truncate">{t[lang].title}</div>
                        <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 bg-slate-800 rounded">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
                        </button>
                    </div>

                    <div className={`sidebar ${sidebarOpen ? 'block' : 'hidden'} md:block w-full md:w-72 bg-slate-900 text-white shadow-xl flex flex-col absolute md:relative z-10 min-h-screen md:min-h-0`}>
                        <div className="p-6">
                            <h1 className="text-xl font-extrabold tracking-tight mb-1">{t[lang].title}</h1>
                            <p className="text-slate-400 text-sm">{t[lang].subtitle}</p>
                        </div>
                        <div className="flex-1 overflow-y-auto nav-scrollbar px-4 pb-6 space-y-2">
                            {categories.map((cat, i) => (
                                <button 
                                    key={cat.id} 
                                    onClick={() => selectCategory(i)}
                                    className={`w-full text-left px-4 py-3 rounded-lg transition-colors text-sm font-medium ${
                                        catIndex === i 
                                            ? 'bg-blue-600 text-white shadow-md' 
                                            : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                                    }`}
                                >
                                    {cat.title[lang]}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col max-h-screen overflow-hidden relative print-full-width">
                        <div className="topbar glass-panel border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10 shadow-sm">
                            <div className="text-sm font-semibold text-gray-500 uppercase tracking-wider hidden sm:block">
                                {categories[catIndex].title[lang]}
                            </div>
                            <div className="flex items-center gap-4 ml-auto">
                                {currentContent.type !== 'assessment' && (
                                    <div className="bg-white border px-4 py-1.5 rounded-full text-sm font-medium shadow-sm flex items-center gap-2">
                                        <span className="text-amber-500 text-lg">★</span> 
                                        <span className="text-gray-600 hidden sm:inline">{t[lang].score}:</span> {score}
                                    </div>
                                )}
                                <button 
                                    onClick={toggleLang}
                                    className="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm"
                                >
                                    {t[lang].langToggle}
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 flex flex-col xl:flex-row gap-6 bg-slate-50 print-full-width">
                            <div className={`print-full-width w-full xl:w-5/12 min-h-[300px] xl:min-h-0 bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden ${currentContent.diagram === 'none' ? 'hidden' : 'flex'}`}>
                                <div className="bg-gray-50 px-4 py-3 border-b text-sm font-bold text-gray-700 flex justify-between">
                                    <span>Visual</span>
                                    <span className="text-gray-400 font-normal">{t[lang].questionText} {contentIndex + 1} {t[lang].of} {currentContents.length}</span>
                                </div>
                                <div className="flex-1 p-4 flex items-center justify-center relative overflow-hidden bg-grid-slate-100">
                                    <div className="absolute inset-0 z-0 opacity-20" style={{backgroundImage: 'radial-gradient(#cbd5e1 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
                                    <div className="w-full h-full relative z-10 drop-shadow-sm">
                                        <DiagramViewer diagramType={currentContent.diagram} lang={lang} />
                                    </div>
                                </div>
                            </div>

                            <div className={`w-full ${currentContent.diagram === 'none' ? 'xl:w-full' : 'xl:w-7/12'} bg-white rounded-2xl shadow-lg border border-gray-100 flex flex-col print-full-width`}>
                                <div className="p-6 sm:p-8 flex-1 overflow-y-auto">
                                    {courseCompleted ? (
                                        <div className="text-center py-12 space-y-4">
                                            <div className="text-6xl mb-4">🏆</div>
                                            <h2 className="text-3xl font-bold text-gray-800">{t[lang].completed}</h2>
                                            <p className="text-gray-600 text-lg">{t[lang].finishCourse}</p>
                                            <div className="mt-8">
                                                <button onClick={() => selectCategory(0)} className="bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-blue-700 transition">
                                                    Mula Semula / Restart
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        renderContent()
                                    )}
                                </div>
                                
                                <div className="progress-bar h-2 bg-gray-100 w-full mt-auto rounded-b-2xl overflow-hidden">
                                    <div 
                                        className="h-full bg-blue-500 transition-all duration-300" 
                                        style={{width: `${((contentIndex + 1) / currentContents.length) * 100}%`}}
                                    ></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

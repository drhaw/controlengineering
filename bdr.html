                            </div>

                            {/* Question Card */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                                <div className="p-6 bg-blue-50/50 border-b border-gray-200">
                                    <p className="text-lg font-medium text-gray-800">{currentQ.q[lang]}</p>
                                </div>
                                
                                {/* Diagram Area */}
                                <div className="p-6 flex justify-center items-center bg-gray-50 min-h-[250px] overflow-x-auto">
                                    {renderDiagram()}
                                </div>

                                {/* Options Area */}
                                <div className="p-6 bg-white border-t border-gray-100">
                                    <h3 className="text-sm font-semibold text-gray-500 mb-4 uppercase tracking-wider">{dict.selectAnswer}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {(currentQ.options[lang] || currentQ.options).map((opt, i) => {
                                            const isSelected = selectedOpt === opt;
                                            const correctAnswer = currentQ.answer[lang] || currentQ.answer;
                                            const showCorrect = isCorrect !== null && opt === correctAnswer;
                                            const showWrong = isCorrect === false && isSelected;
                                            
                                            let btnClass = "border-2 rounded-lg p-4 text-center transition-all duration-200 font-medium text-lg ";
                                            if (showCorrect) {
                                                btnClass += "bg-green-100 border-green-500 text-green-800 shadow-inner";
                                            } else if (showWrong) {
                                                btnClass += "bg-red-100 border-red-500 text-red-800";
                                            } else if (isSelected) {
                                                btnClass += "bg-blue-50 border-blue-500 text-blue-700 shadow-md ring-2 ring-blue-200";
                                            } else if (isCorrect !== null) {
                                                btnClass += "border-gray-200 text-gray-400 opacity-50 cursor-not-allowed";
                                            } else {
                                                btnClass += "border-gray-200 text-gray-700 hover:border-blue-300 hover:bg-blue-50 cursor-pointer";
                                            }

                                            return (
                                                <div 
                                                    key={i} 
                                                    className={btnClass}
                                                    onClick={() => handleOptionClick(opt)}
                                                >
                                                    <span className="svg-text">{opt}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* Actions & Feedback */}
                            <div className="flex flex-col md:flex-row items-center justify-between gap-4 mb-12">
                                <div className="w-full md:w-2/3">
                                    {isCorrect !== null && (
                                        <div className={`p-4 rounded-lg border ${isCorrect ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                                            <p className="font-bold mb-1">{isCorrect ? dict.correct : dict.incorrect}</p>
                                            <p className="text-sm">{currentQ.explanation[lang]}</p>
                                        </div>
                                    )}
                                </div>
                                <div className="w-full md:w-auto flex gap-3">
                                    {isCorrect === null ? (
                                        <button 
                                            onClick={checkAnswer}
                                            disabled={!selectedOpt}
                                            className={`w-full md:w-auto px-8 py-3 rounded-lg font-bold transition-all
                                                ${selectedOpt 
                                                    ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-md hover:shadow-lg' 
                                                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                        >
                                            {dict.checkAnswer}
                                        </button>
                                    ) : (
                                        qIndex < questionsList.length - 1 ? (
                                            <button 
                                                onClick={nextQuestion}
                                                className="w-full md:w-auto px-8 py-3 bg-gray-900 text-white rounded-lg font-bold hover:bg-gray-800 shadow-md"
                                            >
                                                {dict.nextQuestion}
                                            </button>
                                        ) : (
                                            <div className="px-8 py-3 bg-green-600 text-white rounded-lg font-bold text-center">
                                                {dict.completed}
                                            </div>
                                        )
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
